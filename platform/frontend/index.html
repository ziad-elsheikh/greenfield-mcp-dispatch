<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenfield Agricultural Agency</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            color: #2c5e3b;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        select, input, button {
            padding: 8px 12px;
            font-size: 14px;
        }
        input {
            flex-grow: 1;
        }
        button {
            background-color: #2c5e3b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #1e3f28;
        }
        #chatArea {
            border: 1px solid #ccc;
            border-radius: 4px;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
        }
        .user {
            background-color: #e3f2fd;
            margin-left: auto;
            text-align: right;
        }
        .backend {
            background-color: #e8f5e9;
            margin-right: auto;
        }
        .meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h1>Greenfield Agricultural Agency</h1>

    <div class="controls">
        <select id="agentSelect">
            <option value="Memory/RAG Agent">Memory/RAG Agent</option>
            <option value="Planning Agent">Planning Agent</option>
            <option value="State Graph Agent">State Graph Agent</option>
        </select>
    </div>

    <div id="chatArea"></div>

    <div class="controls" style="margin-top: 15px;">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const agentSelect = document.getElementById('agentSelect');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(sender, text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (isUser ? 'user' : 'backend');
            
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.textContent = sender;

            const textDiv = document.createElement('div');
            textDiv.textContent = text;

            msgDiv.appendChild(metaDiv);
            msgDiv.appendChild(textDiv);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            const agent = agentSelect.value;

            if (!message) return;

            appendMessage('User (' + agent + ')', message, true);
            messageInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, agent: agent })
                });

                if (!response.ok) {
                    throw new Error('HTTP error ' + response.status);
                }

                const data = await response.json();
                appendMessage('Backend', data.reply, false);
            } catch (err) {
                appendMessage('Error', 'Failed to reach backend: ' + err.message, false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
